server {
    listen 80;
    listen [::]:80;
    server_name mcp.abdelrhmansaid.com;

    # Certbot serves HTTP validation here before adding HTTPS and a redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/google-tasks-acme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 90s;
        client_max_body_size 1m;

        # OAuth callback queries contain authorization codes. Do not log them.
        access_log off;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
    }
}
